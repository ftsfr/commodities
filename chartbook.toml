[project]
name = "Commodities"
description = "Commodity futures returns and basis data from Bloomberg and WRDS"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/commodities"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (Bloomberg + WRDS required)",
]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

[notebooks.summary_commodities]
name = "summary_commodities"
description = "Summary statistics and visualization of commodity returns"
path = "_output/summary_commodities_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_commodities_returns]
name = "ftsfr_commodities_returns"
description = "Monthly commodity returns matched to HKM factors"
sources = [
    "Bloomberg",
    "WRDS",
    "He-Kelly-Manela",
]
providers = [
    "Bloomberg",
    "WRDS",
    "AQR",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://bloomberg.com",
    "https://wrds-www.wharton.upenn.edu",
]
tags = [
    "commodities",
    "futures",
    "returns",
    "GSCI",
    "energy",
    "metals",
    "agriculture",
]
access_types = [
    "Bloomberg Terminal",
    "WRDS",
    "Public",
]
license = "Bloomberg / WRDS / Public"
restrictions = "No"
pull_method = "GSCI indices from Bloomberg, matched to HKM commodity factors"
path = "./_data/ftsfr_commodities_returns.parquet"
date_col = "ds"
docs = """
## Commodity Returns

Monthly returns for commodities constructed from GSCI indices and futures data.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Commodity identifier (GSCI ticker with _Return suffix) |
| ds | Date (YYYYMM format) |
| y | Monthly return |

### Methodology

- GSCI excess return indices from Bloomberg
- Returns matched to He-Kelly-Manela commodity factors
- Uses Hungarian algorithm for optimal correlation-based matching

### Commodities Covered

- Energy: Crude Oil, Natural Gas, Heating Oil, Gasoline
- Metals: Gold, Silver, Copper, Aluminum, Nickel, Lead, Zinc
- Agriculture: Corn, Wheat, Soybeans, Sugar, Coffee, Cocoa, Cotton
- Livestock: Lean Hogs, Live Cattle, Feeder Cattle

### Data Sources

- Bloomberg: GSCI indices, commodity futures prices
- WRDS: Futures contract data
- He-Kelly-Manela: Commodity factor reference
"""

[charts.commodities_cumulative_returns]
name = "Commodities Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in commodities"
dataframe = "ftsfr_commodities_returns"
path = "./_output/commodities_cumulative_returns.html"
tags = [
    "commodities",
    "futures",
    "cumulative returns",
    "energy",
    "metals",
    "agriculture",
]
docs = """
## Commodities Cumulative Returns

Cumulative returns showing growth of $1 invested in commodities constructed from GSCI indices and futures data.

### Commodities Covered

- Energy: Crude Oil, Natural Gas, Heating Oil, Gasoline
- Metals: Gold, Silver, Copper, Aluminum, Nickel, Lead, Zinc
- Agriculture: Corn, Wheat, Soybeans, Sugar, Coffee, Cocoa, Cotton
- Livestock: Lean Hogs, Live Cattle, Feeder Cattle

### Calculation

Cumulative return = Product of (1 + monthly return) over time

### Data Sources

Bloomberg GSCI indices, WRDS futures data
"""
